name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ['apk/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Guardar resultado en la rama "build"
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "sin log" > /tmp/out/build.log
          cp app/build/outputs/apk/release/*.apk /tmp/out/ 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/out/status.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build
          git rm -rfq .
          git clean -fdxq
          cp /tmp/out/* .
          git add -A
          git commit -qm "Resultado de compilación ${{ github.sha }}"
          git push -f origin build
