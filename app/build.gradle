plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pedro.grabador'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pedro.grabador'
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
